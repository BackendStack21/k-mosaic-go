name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.24", "1.25"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

      - name: Run go vet
        run: go vet ./...

      - name: Run go vet for 32-bit targets
        run: GOARCH=386 go vet ./... && GOARCH=arm go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with the race detector
        run: go test -race ./kem/ ./sign/ ./problems/...

      - name: Build and test on a 32-bit target
        run: |
          GOARCH=386 go test ./internal/wire/ ./kem/ ./sign/ -run 'Deserialize|Truncated|Header|Huge'
          GOARCH=386 go test ./core/ ./utils/ ./problems/qcsd/ ./problems/uov/ ./problems/slhdsa/

      - name: Fuzz deserializers briefly
        run: |
          for f in FuzzDeserializePublicKey FuzzDeserializeCiphertext FuzzDeserializeSecretKey; do go test ./kem/ -run '^$' -fuzz="^$f\$" -fuzztime=10s; done
          for f in FuzzDeserializePublicKey FuzzDeserializeSignature FuzzDeserializeSecretKey; do go test ./sign/ -run '^$' -fuzz="^$f\$" -fuzztime=10s; done
